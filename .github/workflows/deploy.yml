name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test beta
        working-directory: web
        env:
          VITE_SB_URL: ${{ secrets.SB_URL }}
          VITE_SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css js _site/
          cp -r web/dist _site/beta
          cat > _site/config.js << 'EOF'
          const CONFIG = {
            SB_URL: '${{ secrets.SB_URL }}',
            SB_KEY: '${{ secrets.SB_KEY }}',
            GOOGLE_CLIENT_ID: '${{ secrets.GOOGLE_CLIENT_ID }}',
          };
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
